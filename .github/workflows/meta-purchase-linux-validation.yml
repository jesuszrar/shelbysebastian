name: Meta Purchase Linux validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@10.9.9
          test "$(npm --version)" = "10.9.9"

      - name: Install dependencies and generate Prisma Client
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "Unexpected DATABASE_URL in validation environment; refusing to continue."
            exit 1
          fi
          env -u DATABASE_URL npm ci

      - name: Build backend
        run: env -u DATABASE_URL npm run build

      - name: Run security, catalog, and Meta Purchase tests
        run: |
          npm run test:security
          npm run test:catalog-exclusions
          npm exec --no -- tsx --test src/lib/meta-purchase.test.ts

      - name: Verify build outputs and Prisma Client
        run: |
          test -f dist/main.js
          test -f dist/server.js
          test -f dist/lib/meta-purchase.js
          grep -Fq '/api/meta/purchase/:orderId/claim' dist/server.js

          generated_schema="node_modules/.prisma/client/schema.prisma"
          test -f "$generated_schema"
          grep -Eq '^model MetaPurchaseClaim \{' "$generated_schema"
          awk '
            /^model Order \{/ { in_order = 1 }
            in_order && /^[}]$/ { in_order = 0 }
            in_order && /^[[:space:]]+currency[[:space:]]+String[[:space:]]+@default\("COP"\)/ { found = 1 }
            END { exit !found }
          ' "$generated_schema"

          linux_engines="$(find node_modules/.prisma/client -maxdepth 1 -type f -name 'libquery_engine-*.so.node' -print)"
          if [ -z "$linux_engines" ]; then
            echo "No Linux Prisma Node-API query engine was generated."
            exit 1
          fi

          while IFS= read -r engine; do
            [ -n "$engine" ] || continue
            engine_info="$(file "$engine")"
            echo "$engine_info"
            case "$engine_info" in
              *ELF*) ;;
              *)
                echo "The generated Prisma engine is not an ELF Linux binary: $engine"
                exit 1
                ;;
            esac
          done <<< "$linux_engines"

          if find node_modules/.prisma/client -maxdepth 1 -type f -iname '*windows*' -print -quit | grep -q .; then
            echo "A Windows Prisma engine was found in the generated client."
            exit 1
          fi

          printf '%s\n' "Required entrypoint artifacts, claim route, Prisma models, and Linux engine verified."
          printf '%s\n' "$linux_engines"
