name: Meta Purchase Linux validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@10.13.0
          test "$(npm --version)" = "10.13.0"

      - name: Install dependencies and generate Prisma Client
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "Unexpected DATABASE_URL in validation environment; refusing to continue."
            exit 1
          fi
          npm ci

      - name: Build backend
        run: npm run build

      - name: Run security and Meta Purchase tests
        run: |
          npm run test:security
          npm exec --no -- tsx --test src/lib/meta-purchase.test.ts

      - name: Verify build outputs and Prisma Client
        run: |
          test -f dist/main.js
          test -f dist/server.js
          test -f dist/lib/meta-purchase.js
          grep -Fq '/api/meta/purchase/:orderId/claim' dist/server.js

          generated_schema="node_modules/.prisma/client/schema.prisma"
          test -f "$generated_schema"
          grep -Eq '^model MetaPurchaseClaim \{' "$generated_schema"
          awk '
            /^model Order \{/ { in_order = 1 }
            in_order && /^[}]$/ { in_order = 0 }
            in_order && /^[[:space:]]+currency[[:space:]]+String[[:space:]]+@default\("COP"\)/ { found = 1 }
            END { exit !found }
          ' "$generated_schema"

          linux_engines="$(find node_modules/.prisma/client -maxdepth 1 -type f \
            \( -name 'libquery_engine-*.so.node' -o -name 'query-engine-*' -o -name 'query_engine-*linux*' \) \
            -print)"
          if [ -z "$linux_engines" ]; then
            echo "No Linux Prisma query engine was generated."
            exit 1
          fi
          if find node_modules/.prisma/client -maxdepth 1 -type f -iname '*windows*' -print -quit | grep -q .; then
            echo "A Windows Prisma engine was found in the generated client."
            exit 1
          fi

          printf '%s\n' "Required entrypoint artifacts, claim route, Prisma models, and Linux engine verified."
          printf '%s\n' "$linux_engines"
