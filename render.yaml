services:
  - type: web
    name: shelby-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev --no-audit --no-fund && ./node_modules/.bin/prisma generate && ./node_modules/.bin/tsc -p tsconfig.json
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN_CLIENT
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
